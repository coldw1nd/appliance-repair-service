services:
  postgres:
    image: postgres:16-alpine
    container_name: appliance-repair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appliance_repair_service}
      POSTGRES_USER: ${POSTGRES_USER:-appliance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - appliance_repair_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/02_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/03_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    container_name: appliance-repair-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    environment:
      MAVEN_OPTS: >-
        -Dfile.encoding=UTF-8
        -Djansi.force=false
        -Djansi.tmpdir=/workspace/target/tmp
        -Djava.io.tmpdir=/workspace/target/tmp
        -Dstyle.color=never
        -Daether.transport.http.retryHandler.count=10
        -Daether.transport.http.retryHandler.interval=5000
        -Daether.transport.http.retryHandler.intervalMax=30000
        -Daether.connector.http.retryHandler.count=10
        -Daether.connector.http.retryHandler.interval=5000
        -Daether.connector.http.retryHandler.intervalMax=30000
        -Dmaven.wagon.http.retryHandler.count=10
        -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in .env}
      JWT_ISSUER: ${JWT_ISSUER:-appliance-repair-service}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор сервиса}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-true}
    volumes:
      - ./backend/pom.xml:/workspace/pom.xml:ro
      - ./backend/src:/workspace/src:ro
      - backend_target:/workspace/target
      - maven_cache:/root/.m2
    command:
      - /bin/bash
      - -euc
      - |
        mkdir -p /workspace/target/tmp
        export TMPDIR=/workspace/target/tmp
        echo "Starting Appliance Repair Service backend..."
        exec mvn -f /workspace/pom.xml -B -ntp -Dstyle.color=never -Dmaven.test.skip=true \
          org.springframework.boot:spring-boot-maven-plugin:3.5.5:run
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 45
      start_period: 12m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  appliance_repair_data:
  backend_target:
  maven_cache:

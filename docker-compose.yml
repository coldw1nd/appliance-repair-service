services:
  postgres:
    image: postgres:16-alpine
    container_name: appliance-repair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appliance_repair_service}
      POSTGRES_USER: ${POSTGRES_USER:-appliance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - appliance_repair_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/02_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/03_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  appliance_repair_data:
